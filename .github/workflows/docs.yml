name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "cmd/gendocs/**"
      - "internal/cli/**"
      - "internal/core/catalog.go"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "cmd/gendocs/**"
      - "internal/cli/**"
      - "internal/core/catalog.go"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Check the generated CLI reference is committed
        run: make docs-check
      - name: Build the site
        run: npm run build   # fails on broken internal links
        working-directory: docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
