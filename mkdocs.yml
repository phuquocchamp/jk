site_name: jk
site_description: Agent-first Jenkins CLI and MCP server
site_url: https://phuquocchamp.github.io/jk/
repo_url: https://github.com/phuquocchamp/jk
repo_name: phuquocchamp/jk
edit_uri: edit/main/docs/
copyright: >
  MIT licensed. Jenkins® is a registered trademark of LF Charities Inc.;
  jk is not affiliated with the Jenkins project.

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Authentication: authentication.md
      - Configuration: configuration.md
      - Policy: policy.md
      - Tools: tools.md
      - MCP server: mcp.md
      - Output and errors: errors.md
  - CLI reference:
      - jk: reference/jk.md
      - auth status: reference/jk_auth_status.md
      - auth login: reference/jk_auth_login.md
      - auth logout: reference/jk_auth_logout.md
      - job list: reference/jk_job_list.md
      - job get: reference/jk_job_get.md
      - build get: reference/jk_build_get.md
      - build stages: reference/jk_build_stages.md
      - build trigger: reference/jk_build_trigger.md
      - build replay: reference/jk_build_replay.md
      - build stop: reference/jk_build_stop.md
      - log tail: reference/jk_log_tail.md
      - log search: reference/jk_log_search.md
      - test failed: reference/jk_test_failed.md
      - queue get: reference/jk_queue_get.md
      - mcp: reference/jk_mcp.md
      - version: reference/jk_version.md
      - completion: reference/jk_completion.md
  - Project:
      - Releasing: release.md

not_in_nav: |
  /reference/jk_auth.md
  /reference/jk_job.md
  /reference/jk_build.md
  /reference/jk_log.md
  /reference/jk_test.md
  /reference/jk_queue.md
  /reference/jk_completion_*.md

exclude_docs: |
  requirements.txt
